    <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment</title>
  </head>
  <style>
    .header {
      position: relative;
      min-height: 260px;
      margin-top: 20px;
      text-align: center;
      font-size: 50px;
      font-weight: bold;
    }

    .school-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: 190px;
    }

    .school-brand {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      border: 2px solid #345b3b;
      border-radius: 8px;
      background-color: #f5f8f3;
      color: #24452b;
      font-family: Georgia, serif;
      font-size: 16px;
      line-height: 1.3;
      text-align: center;
    }

    .hyperlinks {
      width: 100%;
      margin-top: 8px;
      table-layout: fixed;
      font-size: 13px;
    }

    .hyperlinks th,
    .hyperlinks td {
      padding: 6px 8px;
      overflow-wrap: anywhere;
    }

    .school-brand img {
      display: block;
      width: 100px;
      height: 85px;
      margin: 0 auto 8px;
      object-fit: contain;
    }

    table {
      width: auto;
      margin: 0 auto;
    
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #999;
      padding: 10px 14px;
      text-align: center;
    }

    th {
      background-color: transparent;
    }

    body {
      background-color: transparent;
    }
    

    .Secondbox {
      text-align: center;
      margin-top: 120px;
    }

    .homepage {
      text-align: center;
    }
    .classmate-section {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 160px;
      max-width: 700px;
      margin: 20px 0;
    }

    .classmate-section h2,
    .classmate-name,
    .classmate-photo {
      display: flex;
      align-items: center;
      min-height: 120px;
      margin: 0;
      padding: 12px;
      border-bottom: 1px solid #999;
    }

    .classmate-section h2 {
      grid-column: 1 / -1;
      min-height: 60px;
      margin-top: 0;
      text-align: left;
    }

    .classmate-name {
      text-align: left;
    }

    .classmate-photo {
      justify-content: center;
      border-left: 1px solid #345b3b;
    }

    .classmate-photo img {
      width: 100px;
      height: 100px;
      object-fit: cover;
    }

    @media (max-width: 600px) {
      .classmate-section {
        grid-template-columns: minmax(0, 1fr) 120px;
      }
    }
  </style>
  <body>
    <header class="header">
      My Learning Space
      <div class="school-panel">
        <div class="school-brand">
          <img src="Cordova.jpeg" alt="Cordova International School logo" />
          <div>Cordova Intl School&amp;College</div>
        </div>
        <table class="hyperlinks">
          <thead>
            <tr>
              <th scope="col">Page Name</th>
              <th scope="col">Hyperlinks</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Homepage</td>
              <td><a href="index.html">Click!</a></td>
            </tr>
            <tr>
              <td>Classmates</td>
              <td><a href="Meet my classmates.html">Click!</a></td>
            </tr>
            <tr>
              <td>Meet My Teachers</td>
              <td><a href="Meet My Teachers.html">Click!</a></td>
              <tr>
                <td>
                  My Class Routine
                </td>
                <td><a href="My Class Routine.html">Click!</a></td>
              </tr>

            </tr>
          </tbody>
        </table>
      </div>
    </header>
    
    <hr class="Secondbox" />
    <div class="homepage">My Class Mates</div>
    <hr />
    <section class="classmate-section">
      <h2>My Classmates</h2>
      <p class="classmate-name"><strong>Name:</strong> Tajwar Rezwan Hasan Arshan, Roll: 07</p>
      <div class="classmate-photo">
        <img src="tajwar.jpeg" alt="Tajwar Rezwan Hasan Arshan" />

      <div class="classmate-photo">

    </section>
 


</body>
